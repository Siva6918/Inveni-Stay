# =============================================================================
# Inveni Stay — LocalStack Docker Compose
# =============================================================================
#
# Technology: LocalStack (local AWS cloud emulation)
# Emulates: DynamoDB, SQS, SNS, S3, EventBridge, Lambda, Cognito, OpenSearch
#
# Usage:
#   docker compose -f docker-compose.localstack.yml up -d
#   docker compose -f docker-compose.localstack.yml down
#
# After starting, seed local DynamoDB:
#   npx ts-node backend/scripts/seedDynamoDB.ts --endpoint http://localhost:4566
#
# AWS CLI against LocalStack:
#   aws --endpoint-url=http://localhost:4566 dynamodb list-tables
#   aws --endpoint-url=http://localhost:4566 sqs list-queues
# =============================================================================

version: "3.9"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: inveni_localstack_dev
    ports:
      - "127.0.0.1:4566:4566"    # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      # Core services required by Inveni Stay
      SERVICES: >-
        s3,
        dynamodb,
        sqs,
        sns,
        lambda,
        apigateway,
        events,
        cognito-idp,
        opensearch,
        rds,
        states,
        logs,
        cloudwatch,
        route53,
        cloudfront
      DEFAULT_REGION: ap-south-1
      DEBUG: "${DEBUG:-0}"
      DATA_DIR: /tmp/localstack/data
      # Persist data between restarts
      PERSISTENCE: 1
      # Faster Lambda startup
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: 30
      EAGER_SERVICE_LOADING: 1
      # Automatically provision resources defined in init scripts
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:-}"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./backend/scripts/localstack-init.sh:/etc/localstack/init/ready.d/01-init.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── LocalStack Init (seeds resources automatically on first start) ───────────
  localstack-seed:
    image: amazon/aws-cli:latest
    container_name: inveni_localstack_seed
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./backend/scripts:/scripts
    command: >
      sh -c "
        echo '⚡ Creating DynamoDB table...' &&
        aws dynamodb create-table
          --table-name InveniStayData
          --attribute-definitions
            AttributeName=PK,AttributeType=S
            AttributeName=SK,AttributeType=S
          --key-schema
            AttributeName=PK,KeyType=HASH
            AttributeName=SK,KeyType=RANGE
          --billing-mode PAY_PER_REQUEST
          --region ap-south-1 2>/dev/null || echo 'Table already exists' &&

        echo '⚡ Creating SQS queues...' &&
        aws sqs create-queue --queue-name InveniStayNotificationsDLQ &&
        aws sqs create-queue --queue-name InveniStayNotifications &&

        echo '⚡ Creating SNS topic...' &&
        aws sns create-topic --name InveniStayNotifications &&

        echo '⚡ Creating S3 bucket...' &&
        aws s3 mb s3://inveni-stay-media-local &&

        echo '✅ LocalStack seed complete!'
      "
    restart: "no"

volumes:
  localstack-data:
    driver: local
